[package]
name = "holographic-eye"
version = "1.3.0"
description = "The Holographic Eye — glass cockpit for the Hermes holographic memory"
authors = ["Ben"]
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
dirs = "5"
chrono = "0.4"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
javascriptcore-rs = "=1.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
