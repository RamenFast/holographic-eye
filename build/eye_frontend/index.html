<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Holographic Eye</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23a9d3e8' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23a9d3e8' stroke-width='1.1' opacity='.7'/%3E%3Cpath d='M 16 6 A 10 10 0 0 1 25.5 13' fill='none' stroke='%23db3776' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23f1bf40'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <div class="statusbar">
    <span class="glyph-eye pulsing" id="sb-glyph">⊙</span>
    <span class="appname">The Holographic Eye</span>
    <span class="live-dot off" id="sb-live"></span><span id="sb-livelabel">connecting</span>
    <span class="metrics" id="sb-metrics">attaching…</span>
    <span class="sb-right">
      <span id="sb-ask" title="compose a request over selected facts">ask agent</span>
      <span id="sb-workbench" title="⌘R">reason</span>
      <span id="sb-backup" title="backup memory">backup</span>
      <span id="sb-settings" title="settings · legend · terminology">⚙</span>
      <span id="sb-help" title="manual (?)">?</span>
    </span>
  </div>
  <div class="main">
    <div class="pane" id="pane-left"></div>
    <div class="field-wrap" id="field-wrap">
      <div class="field-title">T H E&nbsp;&nbsp;F I E L D</div>
      <canvas></canvas>
      <div class="tooltip" style="display:none"></div>
      <pre class="mathlog"></pre>
    </div>
    <div class="pane" id="pane-inspect"></div>
  </div>
  <div class="stream" id="stream"></div>
</div>
<div class="flowerbed"></div>
<div class="cottage"></div>
<script src="bundle.js"></script>
</body>
</html>
