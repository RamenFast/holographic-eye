<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Holographic Eye</title>
<script>
try {
  document.documentElement.dataset.theme = localStorage.getItem("eyeTheme") || "blossom_dark";
  document.documentElement.dataset.stream = localStorage.getItem("eyeStreamExpanded") === "true"
    ? "expanded" : "collapsed";
} catch (e) {
  document.documentElement.dataset.theme = "blossom_dark";
  document.documentElement.dataset.stream = "collapsed";
}
</script>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="favicon.png">
</head>
<body>
<div class="app">
  <header class="statusbar">
    <span class="glyph-eye pulsing" id="sb-glyph" aria-hidden="true">⊙</span>
    <span class="appname">The Holographic Eye</span>
    <span class="connection" role="status" aria-live="polite">
      <span class="live-dot off" id="sb-live" aria-hidden="true"></span><span id="sb-livelabel">connecting</span>
    </span>
    <span class="metrics" id="sb-metrics">attaching…</span>
    <nav class="sb-right" aria-label="Application actions">
      <button type="button" class="header-action" id="sb-ask" title="Compose a request over selected facts">ask agent</button>
      <button type="button" class="header-action" id="sb-workbench" title="Open Reason · Ctrl+R">reason</button>
      <button type="button" class="header-action" id="sb-backup" title="Backup memory">backup</button>
      <button type="button" class="header-action" id="sb-settings" title="Settings · theme · text size">settings</button>
      <button type="button" class="header-action" id="sb-help" title="Open manual · ?">manual</button>
    </nav>
  </header>
  <main class="main">
    <aside class="pane" id="pane-left" aria-label="Evidence bench"></aside>
    <section class="field-wrap" id="field-wrap" aria-label="The Field">
      <canvas class="vine vine-l" aria-hidden="true"></canvas>
      <canvas class="vine vine-r" aria-hidden="true"></canvas>
      <canvas class="cottage-c" aria-hidden="true"></canvas>
      <div class="field-title">T H E&nbsp;&nbsp;F I E L D</div>
      <nav class="context-rail" id="context-rail" aria-label="Active Field context" hidden></nav>
      <canvas class="fieldc" aria-label="Fact projection"></canvas>
      <div class="tooltip" style="display:none"></div>
      <pre class="mathlog"></pre>
      <section class="boot-error" id="boot-error" role="alert" hidden>
        <h1>The Eye could not attach</h1>
        <p id="boot-error-message"></p>
        <button type="button" class="btn commit" id="boot-retry">Retry</button>
      </section>
    </section>
    <aside class="pane inspect-pane" id="pane-inspect" aria-label="Inspect"></aside>
  </main>
  <section class="stream-dock" id="stream-dock" aria-label="Memory stream">
    <button type="button" class="stream-toggle" id="stream-toggle" aria-expanded="false" aria-controls="stream">
      <span>STREAM</span><span class="stream-glance" id="stream-glance">waiting for journal events</span><span class="stream-toggle-state">expand</span><b aria-hidden="true">⌃</b>
    </button>
    <div class="stream" id="stream" role="log" aria-label="Journal events"></div>
  </section>
  <div class="garden" aria-hidden="true"><canvas></canvas></div>
</div>
<script src="bundle.js"></script>
</body>
</html>
