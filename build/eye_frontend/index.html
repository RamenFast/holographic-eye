<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Holographic Eye</title>
<script>
/* stamp the persisted theme before first paint (no flash of the
   default room); the full theme bridge lives in the bundle */
try {
  document.documentElement.dataset.theme =
    localStorage.getItem("eyeTheme") || "blossom_dark";
} catch (e) { document.documentElement.dataset.theme = "blossom_dark"; }
</script>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="favicon.png">
</head>
<body>
<div class="app">
  <div class="statusbar">
    <span class="glyph-eye pulsing" id="sb-glyph">⊙</span>
    <span class="appname">The Holographic Eye</span>
    <span class="live-dot off" id="sb-live"></span><span id="sb-livelabel">connecting</span>
    <span class="metrics" id="sb-metrics">attaching…</span>
    <span class="sb-right">
      <span id="sb-ask" title="compose a request over selected facts">ask agent</span>
      <span id="sb-workbench" title="⌘R">reason</span>
      <span id="sb-backup" title="backup memory">backup</span>
      <span id="sb-settings" title="settings · theme · text size">⚙</span>
      <span id="sb-help" title="manual (?)">?</span>
    </span>
  </div>
  <div class="main">
    <div class="pane" id="pane-left"></div>
    <div class="field-wrap" id="field-wrap">
      <canvas class="vine vine-l"></canvas>
      <canvas class="vine vine-r"></canvas>
      <canvas class="cottage-c"></canvas>
      <div class="field-title">T H E&nbsp;&nbsp;F I E L D</div>
      <canvas class="fieldc"></canvas>
      <div class="tooltip" style="display:none"></div>
      <pre class="mathlog"></pre>
    </div>
    <div class="pane" id="pane-inspect"></div>
  </div>
  <div class="stream" id="stream"></div>
  <div class="garden"><canvas></canvas></div>
</div>
<script src="bundle.js"></script>
</body>
</html>
